<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACM-W Quiz Challenge</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel to compile JSX directly in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const QUIZ_QUESTIONS = [
      {
        id: 1,
        topic: "ACM & ACM-W",
        question: "What does ACM stand for?",
        options: [
          "Association for Computing Machinery",
          "Advanced Computing & Machines",
          "Association of Computer Manufacturers",
          "Applied Computation Modeling"
        ],
        correctAnswer: 0,
        explanation: "ACM stands for the Association for Computing Machinery, founded in 1947 as the world's premier computing society."
      },
      {
        id: 2,
        topic: "ACM-W",
        question: "What is the primary mission of ACM-W?",
        options: [
          "Building commercial enterprise software",
          "Supporting, celebrating, and advocating for women in computing globally",
          "Standardizing quantum computing hardware",
          "Hosting gaming tournaments for university students"
        ],
        correctAnswer: 1,
        explanation: "ACM-W supports, celebrates, and advocates internationally for the full engagement of women in all aspects of the computing field."
      },
      {
        id: 3,
        topic: "Women in Computing",
        question: "Who is widely recognized as the world's first computer programmer for her work on Charles Babbage’s Analytical Engine?",
        options: [
          "Grace Hopper",
          "Ada Lovelace",
          "Margaret Hamilton",
          "Katherine Johnson"
        ],
        correctAnswer: 1,
        explanation: "Ada Lovelace published the first algorithm intended to be executed by a machine in 1843."
      },
      {
        id: 4,
        topic: "Artificial Intelligence",
        question: "What is Artificial Intelligence (AI)?",
        options: [
          "The physical manufacturing of silicon microchips",
          "A software program exclusively used for web page formatting",
          "The simulation of human intelligence processes by computer systems",
          "The process of storing compressed video files in cloud storage"
        ],
        correctAnswer: 2,
        explanation: "AI refers to computational systems that simulate human intelligence to perform reasoning, problem-solving, and pattern recognition."
      },
      {
        id: 5,
        topic: "Machine Learning",
        question: "How does Machine Learning (ML) primarily differ from traditional rule-based programming?",
        options: [
          "ML writes code in HTML instead of binary machine code",
          "ML enables systems to learn and improve from data without being explicitly hardcoded with every rule",
          "ML requires human operators to manually type every output decision",
          "ML only runs on analog mainframe supercomputers"
        ],
        correctAnswer: 1,
        explanation: "Traditional programming uses explicit rules and inputs to yield outputs. Machine learning uses data and outputs to infer rules."
      },
      {
        id: 6,
        topic: "Artificial Intelligence",
        question: "Which of the following is a classic example of Natural Language Processing (NLP)?",
        options: [
          "AI chatbots & conversational virtual assistants",
          "Formatting a hard drive file system into FAT32",
          "Calculating the thermal cooling capacity of a CPU fan",
          "Overclocking a desktop GPU"
        ],
        correctAnswer: 0,
        explanation: "Conversational assistants parse, analyze, and generate human languages, which is the core goal of NLP."
      },
      {
        id: 7,
        topic: "Machine Learning",
        question: "In Machine Learning and Data Science, what is a 'dataset'?",
        options: [
          "A physical hardware rack containing network switches",
          "A collection of organized data used to train, validate, and evaluate algorithms",
          "A specific keyboard shortcut used in code IDEs",
          "An encrypted master password stored in system memory"
        ],
        correctAnswer: 1,
        explanation: "A dataset is an organized collection of records, instances, or features used for model training and evaluation."
      },
      {
        id: 8,
        topic: "Deep Learning",
        question: "What is an Artificial Neural Network (ANN) inspired by?",
        options: [
          "The biological network of neurons in the human brain",
          "Fiber-optic transoceanic internet cables",
          "Mechanical gears inside early clock towers",
          "The planetary orbits within the solar system"
        ],
        correctAnswer: 0,
        explanation: "ANNs are interconnected node networks inspired by biological neural networks in animal brains."
      },
      {
        id: 9,
        topic: "General Tech & Computing",
        question: "Which pioneer coined the term 'debugging' after finding an actual moth inside a Mark II computer?",
        options: [
          "Rear Admiral Grace Hopper",
          "Hedy Lamarr",
          "Radia Perlman",
          "Frances Allen"
        ],
        correctAnswer: 0,
        explanation: "Grace Hopper popularized the term 'debugging' and was also key in developing the first compiler and COBOL."
      },
      {
        id: 10,
        topic: "Machine Learning",
        question: "What type of machine learning uses labeled input-output pairs to train predictive models?",
        options: [
          "Unsupervised Learning",
          "Supervised Learning",
          "Zero-Shot Random Sampling",
          "Heuristic Cold-Booting"
        ],
        correctAnswer: 1,
        explanation: "Supervised Learning involves feeding pairs of inputs and corresponding target labels to train model predictions."
      }
    ];

    function App() {
      const [screen, setScreen] = useState("welcome");
      const [playerName, setPlayerName] = useState("");
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [tempSelectedOption, setTempSelectedOption] = useState(null);
      const [leaderboard, setLeaderboard] = useState([
        { name: "Ada L.", score: 10, total: 10, percentage: 100, date: "Recently" },
        { name: "Grace H.", score: 9, total: 10, percentage: 90, date: "1h ago" }
      ]);

      const totalQuestions = QUIZ_QUESTIONS.length;
      const completedAnswersCount = Object.keys(selectedAnswers).length;
      const progressPercentage = Math.round((completedAnswersCount / totalQuestions) * 100);

      const correctCount = Object.entries(selectedAnswers).reduce((acc, [qIdx, ansIdx]) => {
        return ansIdx === QUIZ_QUESTIONS[qIdx].correctAnswer ? acc + 1 : acc;
      }, 0);
      const scorePercentage = Math.round((correctCount / totalQuestions) * 100);

      const handleStartQuiz = () => {
        setSelectedAnswers({});
        setCurrentQuestionIndex(0);
        setTempSelectedOption(null);
        setScreen("quiz");
      };

      const handleNextQuestion = () => {
        if (tempSelectedOption === null) return;
        const updatedAnswers = { ...selectedAnswers, [currentQuestionIndex]: tempSelectedOption };
        setSelectedAnswers(updatedAnswers);

        if (currentQuestionIndex + 1 < totalQuestions) {
          setCurrentQuestionIndex(prev => prev + 1);
          setTempSelectedOption(updatedAnswers[currentQuestionIndex + 1] ?? null);
        } else {
          const finalScore = Object.entries(updatedAnswers).reduce((acc, [qIdx, ansIdx]) => {
            return ansIdx === QUIZ_QUESTIONS[qIdx].correctAnswer ? acc + 1 : acc;
          }, 0);
          const finalPercentage = Math.round((finalScore / totalQuestions) * 100);
          setLeaderboard(prev => [
            {
              name: playerName.trim() || "Anonymous Scholar",
              score: finalScore,
              total: totalQuestions,
              percentage: finalPercentage,
              date: "Just now"
            },
            ...prev
          ].slice(0, 10));
          setScreen("result");
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between relative overflow-x-hidden">
          <div className="fixed inset-0 pointer-events-none z-0">
            <div className="absolute top-[-10%] left-[20%] w-[500px] h-[500px] bg-indigo-600/15 rounded-full blur-[120px]"></div>
            <div className="absolute bottom-[-10%] right-[15%] w-[450px] h-[450px] bg-fuchsia-600/15 rounded-full blur-[140px]"></div>
          </div>

          <header className="relative z-10 w-full border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-md">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setScreen("welcome")}>
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg font-black text-white text-sm">W</div>
                <span className="font-bold tracking-tight text-white flex items-center gap-1.5 text-base">
                  ACM-W <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-medium">Recruitment</span>
                </span>
              </div>
              <button
                onClick={() => setScreen("leaderboard")}
                className="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 border border-slate-700/50 transition-all flex items-center gap-1.5"
              >
                <span>🏆</span> Leaderboard
              </button>
            </div>
          </header>

          <main className="relative z-10 flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-12 flex flex-col justify-center">
            {screen === "welcome" && (
              <div className="flex flex-col items-center text-center space-y-8 animate-fadeIn">
                <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 text-xs font-semibold">
                  <span className="w-2 h-2 rounded-full bg-indigo-400 animate-ping"></span>
                  ACM-W RECRUITMENT ASSESSMENT
                </div>
                <div className="space-y-4 max-w-2xl">
                  <h1 className="text-4xl sm:text-6xl font-extrabold tracking-tight text-white leading-tight">
                    Test your knowledge. <br />
                    <span className="bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">
                      Think smarter. Build the future.
                    </span>
                  </h1>
                  <p className="text-slate-400 text-base sm:text-lg">
                    Evaluate your knowledge across ACM history, Women in Computing, Artificial Intelligence, and Machine Learning.
                  </p>
                </div>
                <div className="w-full max-w-md bg-slate-900/80 border border-slate-800 p-6 rounded-3xl backdrop-blur-xl shadow-2xl space-y-4">
                  <input
                    type="text"
                    value={playerName}
                    onChange={(e) => setPlayerName(e.target.value)}
                    placeholder="Candidate Name (Optional)"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                  <button
                    onClick={handleStartQuiz}
                    className="w-full py-3.5 px-6 rounded-xl font-bold text-sm bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white hover:opacity-95 transition-all shadow-lg shadow-indigo-500/25"
                  >
                    Begin Assessment →
                  </button>
                </div>
              </div>
            )}

            {screen === "quiz" && (
              <div className="w-full max-w-2xl mx-auto space-y-6 animate-fadeIn">
                <div className="space-y-2.5">
                  <div className="flex justify-between items-end text-xs">
                    <div>
                      <span className="text-indigo-400 font-semibold uppercase tracking-wider text-[11px]">
                        {QUIZ_QUESTIONS[currentQuestionIndex].topic}
                      </span>
                      <div className="text-slate-300 font-bold text-sm">
                        Question {currentQuestionIndex + 1} of {totalQuestions}
                      </div>
                    </div>
                    <span className="text-slate-400 text-xs font-mono font-semibold">
                      {progressPercentage}% Completed
                    </span>
                  </div>
                  <div className="w-full h-2.5 bg-slate-900 border border-slate-800 rounded-full overflow-hidden p-[1px]">
                    <div
                      className="h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-full transition-all duration-500"
                      style={{ width: `${progressPercentage}%` }}
                    ></div>
                  </div>
                </div>

                <div className="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 sm:p-8 backdrop-blur-xl shadow-2xl space-y-6">
                  <h2 className="text-lg sm:text-xl font-bold text-slate-100">
                    {QUIZ_QUESTIONS[currentQuestionIndex].question}
                  </h2>
                  <div className="space-y-3">
                    {QUIZ_QUESTIONS[currentQuestionIndex].options.map((opt, idx) => (
                      <button
                        key={idx}
                        onClick={() => setTempSelectedOption(idx)}
                        className={`w-full text-left p-4 rounded-2xl border transition-all flex items-center space-x-3.5 ${
                          tempSelectedOption === idx
                            ? "bg-indigo-950/70 border-indigo-500 text-white ring-1 ring-indigo-500"
                            : "bg-slate-950/50 border-slate-800/80 text-slate-300 hover:bg-slate-800/60"
                        }`}
                      >
                        <div className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs ${
                          tempSelectedOption === idx ? "bg-indigo-500 text-white" : "bg-slate-800 text-slate-400"
                        }`}>
                          {["A", "B", "C", "D"][idx]}
                        </div>
                        <span className="text-sm font-medium">{opt}</span>
                      </button>
                    ))}
                  </div>
                  <div className="pt-2 flex justify-end">
                    <button
                      onClick={handleNextQuestion}
                      disabled={tempSelectedOption === null}
                      className={`px-7 py-3 rounded-xl font-bold text-sm transition-all ${
                        tempSelectedOption !== null
                          ? "bg-gradient-to-r from-indigo-500 to-purple-500 text-white hover:opacity-95"
                          : "bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700/40"
                      }`}
                    >
                      {currentQuestionIndex + 1 === totalQuestions ? "Submit Assessment" : "Next Question →"}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {screen === "result" && (
              <div className="w-full max-w-xl mx-auto space-y-6 animate-fadeIn">
                <div className="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 backdrop-blur-xl shadow-2xl text-center space-y-6">
                  <div className="text-4xl font-extrabold text-white">{scorePercentage}%</div>
                  <div className="text-slate-400 text-sm">{correctCount} of {totalQuestions} Correct</div>
                  <div className="grid grid-cols-2 gap-3 pt-2">
                    <div className="p-3 rounded-xl bg-emerald-950/20 border border-emerald-500/20 text-emerald-400 font-bold">
                      Correct: {correctCount}
                    </div>
                    <div className="p-3 rounded-xl bg-rose-950/20 border border-rose-500/20 text-rose-400 font-bold">
                      Incorrect: {totalQuestions - correctCount}
                    </div>
                  </div>
                  <div className="space-y-2 pt-2">
                    <button
                      onClick={() => setScreen("review")}
                      className="w-full py-3.5 rounded-xl font-bold text-sm bg-gradient-to-r from-indigo-500 to-purple-500 text-white"
                    >
                      Review Answers
                    </button>
                    <button
                      onClick={() => setScreen("welcome")}
                      className="w-full py-3 rounded-xl font-semibold text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700"
                    >
                      Retake Quiz
                    </button>
                  </div>
                </div>
              </div>
            )}

            {screen === "review" && (
              <div className="w-full max-w-3xl mx-auto space-y-6 animate-fadeIn pb-8">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <h2 className="text-xl font-bold text-white">Answer Key</h2>
                  <button
                    onClick={() => setScreen("result")}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700"
                  >
                    ← Back to Result
                  </button>
                </div>
                <div className="space-y-4">
                  {QUIZ_QUESTIONS.map((q, idx) => {
                    const userAns = selectedAnswers[idx];
                    const isCorrect = userAns === q.correctAnswer;
                    return (
                      <div key={q.id} className={`p-5 rounded-2xl border ${isCorrect ? "border-emerald-500/30 bg-slate-900/60" : "border-rose-500/30 bg-slate-900/60"}`}>
                        <div className="flex justify-between items-center mb-2">
                          <span className="text-xs font-bold text-slate-400 uppercase">Q{idx + 1} &bull; {q.topic}</span>
                          <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${isCorrect ? "bg-emerald-500/10 text-emerald-400" : "bg-rose-500/10 text-rose-400"}`}>
                            {isCorrect ? "✓ Correct" : "✕ Incorrect"}
                          </span>
                        </div>
                        <h3 className="text-sm font-semibold text-slate-200 mb-2">{q.question}</h3>
                        <p className="text-xs text-slate-400">Your Answer: <span className={isCorrect ? "text-emerald-400 font-semibold" : "text-rose-400 font-semibold"}>{userAns !== undefined ? q.options[userAns] : "None"}</span></p>
                        {!isCorrect && (
                          <p className="text-xs text-emerald-400 mt-1">Correct Answer: <span className="font-semibold">{q.options[q.correctAnswer]}</span></p>
                        )}
                        <p className="text-xs text-indigo-300 mt-2 bg-indigo-950/20 p-2.5 rounded-lg"><strong>Explanation:</strong> {q.explanation}</p>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {screen === "leaderboard" && (
              <div className="w-full max-w-2xl mx-auto space-y-6 animate-fadeIn">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <h2 className="text-xl font-bold text-white">Leaderboard</h2>
                  <button
                    onClick={() => setScreen("welcome")}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700"
                  >
                    ← Back
                  </button>
                </div>
                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl divide-y divide-slate-800 overflow-hidden">
                  {leaderboard.map((item, idx) => (
                    <div key={idx} className="p-4 flex items-center justify-between">
                      <div className="flex items-center space-x-3">
                        <span className="w-6 h-6 rounded-md bg-slate-800 flex items-center justify-center text-xs font-bold text-slate-300">#{idx + 1}</span>
                        <span className="text-sm font-semibold text-slate-200">{item.name}</span>
                      </div>
                      <span className="text-sm font-bold text-indigo-400">{item.percentage}% ({item.score}/{item.total})</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
